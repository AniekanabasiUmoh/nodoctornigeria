[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nstg-medical-ai-assistant"
version = "0.1.0"
description = "Phase 1 ingestion and hierarchical chunking pipeline for the NSTG Medical AI Assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.29,<1.0",
]

[tool.setuptools]
packages = ["nstg_ai"]
